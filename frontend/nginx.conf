server {
    listen 3000;
    server_name localhost;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:8081; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;

    # Docker DNS: адрес bionicpro-auth резолвится заново после пересоздания контейнера
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $bff http://bionicpro-auth:8000;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Логин, callback, сессии и защищенные API обслуживает bionicpro-auth (BFF).
    # Один origin для SPA и BFF: сессионная cookie HttpOnly+Secure+SameSite=Lax
    # отправляется браузером автоматически, CORS не нужен.
    location /auth/ {
        proxy_pass $bff;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass $bff;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
