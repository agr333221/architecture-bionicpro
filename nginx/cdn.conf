# Эмуляция CDN: nginx как reverse proxy перед Minio (S3) с кешированием отчетов.
#
# - Ключ кеша = путь объекта без query-параметров подписи: повторные запросы
#   одного и того же отчета (разные подписанные ссылки) обслуживаются из кеша
#   и не доходят до Minio.
# - Объекты отчетов неизменяемы: версия данных ETL входит в путь
#   (reports/<user_key>/<data_version>/<period>.json). Новый прогон ETL -> новый
#   путь -> старый кеш не используется и вытесняется по inactive. Явная
#   инвалидация не требуется, при необходимости можно обойти кеш заголовком
#   X-Cache-Bypass из внутренней сети.
# - Кешируются только успешные ответы, 403/404 не кешируются.

proxy_cache_path /var/cache/nginx/reports levels=1:2 keys_zone=reports_cache:10m
                 max_size=1g inactive=60m use_temp_path=off;

map $http_x_cache_bypass $cache_bypass {
    default 0;
    "1"     1;
}

server {
    listen 8081;
    server_name localhost;

    # Docker DNS: адрес Minio резолвится заново после пересоздания контейнера
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $s3 http://minio:9000;

    # Только чтение отчетов из бакета reports
    location /reports/ {
        limit_except GET HEAD { deny all; }

        proxy_pass $s3;
        proxy_http_version 1.1;
        # Подпись SigV4 выписана для хоста minio:9000
        proxy_set_header Host minio:9000;

        proxy_cache reports_cache;
        proxy_cache_key $uri;
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 10m;
        proxy_cache_valid any 0;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_bypass $cache_bypass;
        # Объект отдается с Cache-Control: private (для браузеров и чужих прокси),
        # а политику кеширования CDN задаем сами через proxy_cache_valid
        proxy_ignore_headers Cache-Control Expires Set-Cookie;

        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "http://localhost:3000" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /healthz {
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
