# BionicPRO: учебный стенд проектной работы 9 спринта.
#
# Профили (чтобы не поднимать все сразу на машине с 8 ГБ RAM):
#   (без профиля) - задание 1 и 3: Keycloak, LDAP, Redis, bionicpro-auth, фронтенд,
#                   CRM DB, телеметрия, ClickHouse, reports-api, Minio, CDN (nginx)
#   airflow       - задание 2: Airflow (ETL и витрина отчетов)
#   cdc           - задание 4: Kafka, Kafka Connect (Debezium), прием в ClickHouse
#
#   docker compose --profile airflow --profile cdc up -d --build
#
# Все секреты берутся из .env (см. .env.example).

name: bionicpro

x-restart: &restart
  restart: unless-stopped

services:
  # ===================================================================
  # Задание 1. Безопасность: Keycloak + LDAP + BFF bionicpro-auth
  # ===================================================================
  keycloak_db:
    image: postgres:16-alpine
    <<: *restart
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak_user -d keycloak_db"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    <<: *restart
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Браузер ходит на localhost:8080, сервисы - на keycloak:8080, issuer один и тот же
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=50 -Xms256m -Xmx768m"
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    depends_on:
      keycloak_db:
        condition: service_healthy
      openldap:
        condition: service_started

  # Одноразовая настройка realm: PKCE, токены, LDAP, OTP, Яндекс ID, экспорт realm
  keycloak-config:
    build: ./keycloak/configure
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      FRONTEND_URL: http://localhost:3000
      BIONICPRO_AUTH_CLIENT_SECRET: ${BIONICPRO_AUTH_CLIENT_SECRET}
      LDAP_URL: ldap://openldap:389
      LDAP_BIND_DN: cn=admin,dc=example,dc=com
      LDAP_BIND_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      EXPORT_FILE: /export/keycloak-results-export.json
    volumes:
      - ./keycloak:/export
    depends_on:
      - keycloak
    restart: "no"

  # LDAP представительства BionicPRO в другой стране
  openldap:
    image: osixia/openldap:1.5.0
    <<: *restart
    command: --copy-service
    environment:
      LDAP_ORGANISATION: BionicPRO EU
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      LDAP_TLS: "false"
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-bionicpro.ldif:ro
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
    ports:
      - "389:389"

  redis:
    image: redis:7.4-alpine
    <<: *restart
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      retries: 20

  bionicpro-auth:
    build: ./bionicpro-auth
    <<: *restart
    environment:
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: reports-realm
      KEYCLOAK_CLIENT_ID: bionicpro-auth
      KEYCLOAK_CLIENT_SECRET: ${BIONICPRO_AUTH_CLIENT_SECRET}
      AUTH_REDIRECT_URI: http://localhost:3000/auth/callback
      FRONTEND_URL: http://localhost:3000
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TOKEN_ENC_KEY: ${TOKEN_ENC_KEY}
      SESSION_COOKIE_SECURE: "true"
      SESSION_IDLE_TTL: "1800"
      REPORTS_API_URL: http://reports-api:8001
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    <<: *restart
    ports:
      - "3000:3000"
    depends_on:
      - bionicpro-auth

  # ===================================================================
  # Источники данных: CRM (OLTP) и телеметрия протезов
  # ===================================================================
  crm-db:
    image: postgres:16-alpine
    <<: *restart
    # logical WAL нужен Debezium (задание 4)
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: ${CRM_DB_USER}
      POSTGRES_PASSWORD: ${CRM_DB_PASSWORD}
    volumes:
      - ./crm/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - crm-db-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CRM_DB_USER} -d crm"]
      interval: 5s
      retries: 20

  telemetry-db:
    image: postgres:16-alpine
    <<: *restart
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: ${TELEMETRY_DB_USER}
      POSTGRES_PASSWORD: ${TELEMETRY_DB_PASSWORD}
    volumes:
      - ./telemetry/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - telemetry-db-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TELEMETRY_DB_USER} -d telemetry"]
      interval: 5s
      retries: 20

  # ===================================================================
  # Задание 2. OLAP + сервис отчетов
  # ===================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    <<: *restart
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_ADMIN_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_AIRFLOW_PASSWORD: ${CLICKHOUSE_AIRFLOW_PASSWORD}
      CLICKHOUSE_REPORTS_API_PASSWORD: ${CLICKHOUSE_REPORTS_API_PASSWORD}
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "8123:8123"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "${CLICKHOUSE_ADMIN_USER}", "--password", "${CLICKHOUSE_ADMIN_PASSWORD}", "-q", "SELECT 1"]
      interval: 5s
      retries: 30

  reports-api:
    build: ./reports-api
    <<: *restart
    environment:
      JWT_ISSUER: http://localhost:8080/realms/reports-realm
      JWKS_URI: http://keycloak:8080/realms/reports-realm/protocol/openid-connect/certs
      JWT_AUDIENCE: reports-api
      REPORTS_REQUIRED_ROLE: prothetic_user
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: reports_api
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_REPORTS_API_PASSWORD}
      # airflow - витрина DAG-а (задание 2), cdc - витрина MaterializedView (задание 4)
      REPORT_SOURCE: ${REPORT_SOURCE:-cdc}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: reports
      CDN_PUBLIC_URL: http://localhost:8081
      REPORT_LINK_TTL: "900"
      REPORT_USER_KEY_SECRET: ${REPORT_USER_KEY_SECRET}
    depends_on:
      clickhouse:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # Метаданные Airflow
  airflow-db:
    profiles: ["airflow"]
    image: postgres:16-alpine
    <<: *restart
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      retries: 20

  airflow:
    profiles: ["airflow"]
    build: ./airflow
    <<: *restart
    entrypoint: ["/bin/bash", "/opt/airflow/entrypoint.sh"]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: utc
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__WEBSERVER__WORKERS: "1"
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW_CONN_CRM_DB: postgresql://${CRM_DB_USER}:${CRM_DB_PASSWORD}@crm-db:5432/crm
      AIRFLOW_CONN_TELEMETRY_DB: postgresql://${TELEMETRY_DB_USER}:${TELEMETRY_DB_PASSWORD}@telemetry-db:5432/telemetry
      # airflow - CRM выгружается DAG-ом; cdc - CRM приходит через Debezium (задание 4)
      AIRFLOW_VAR_CRM_SOURCE: ${CRM_SOURCE:-cdc}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: airflow
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_AIRFLOW_PASSWORD}
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/entrypoint.sh:/opt/airflow/entrypoint.sh:ro
      - airflow-logs:/opt/airflow/logs
    ports:
      - "8082:8080"
    depends_on:
      airflow-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      crm-db:
        condition: service_healthy
      telemetry-db:
        condition: service_healthy

  # ===================================================================
  # Задание 3. S3 (Minio) + CDN (nginx reverse proxy с кешем)
  # ===================================================================
  # Официальные образы minio/minio больше не публикуются в Docker Hub,
  # поэтому используется сборка Bitnami того же релиза Minio (RELEASE.2025-04-22).
  minio:
    image: bitnamilegacy/minio:2025.4.22
    <<: *restart
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_PORT_NUMBER: "9000"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    volumes:
      - minio-data:/bitnami/minio/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      retries: 30

  # Создает приватный бакет reports и правило жизненного цикла (старые версии отчетов удаляются)
  minio-init:
    image: bitnamilegacy/minio-client:2025.4.16
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing local/reports
        mc anonymous set none local/reports
        mc ilm rule ls local/reports 2>/dev/null | grep -q Expiration || mc ilm rule add --expire-days 7 local/reports
        echo "bucket reports is ready"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  cdn:
    image: nginx:1.27-alpine
    <<: *restart
    volumes:
      - ./nginx/cdn.conf:/etc/nginx/conf.d/default.conf:ro
      - cdn-cache:/var/cache/nginx
    ports:
      - "8081:8081"
    depends_on:
      - minio

  # ===================================================================
  # Задание 4. CDC: Debezium -> Kafka -> ClickHouse KafkaEngine
  # ===================================================================
  kafka:
    profiles: ["cdc"]
    image: apache/kafka:3.8.0
    <<: *restart
    environment:
      CLUSTER_ID: bionicpro-kafka-cluster-01
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "9094:9094"
    # Легкая проверка порта: запуск kafka-*.sh стартует отдельную JVM и сильно грузит CPU
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9092"]
      interval: 15s
      start_period: 20s
      retries: 20

  kafka-connect:
    profiles: ["cdc"]
    image: quay.io/debezium/connect:2.7.3.Final
    <<: *restart
    # Креды БД CRM передаются коннектору через FileConfigProvider, а не в REST-конфиге
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mkdir -p /kafka/secrets
        printf 'user=%s\npassword=%s\n' "$$CRM_DB_USER" "$$CRM_DB_PASSWORD" > /kafka/secrets/crm.properties
        chmod 600 /kafka/secrets/crm.properties
        exec /docker-entrypoint.sh start
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: bionicpro-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_CONFIG_PROVIDERS: file
      CONNECT_CONFIG_PROVIDERS_FILE_CLASS: org.apache.kafka.common.config.provider.FileConfigProvider
      HEAP_OPTS: "-Xms256m -Xmx512m"
      CRM_DB_USER: ${CRM_DB_USER}
      CRM_DB_PASSWORD: ${CRM_DB_PASSWORD}
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      crm-db:
        condition: service_healthy

  # Регистрация Debezium-коннектора CRM (debezium/crm-connector.json)
  debezium-init:
    profiles: ["cdc"]
    image: quay.io/debezium/connect:2.7.3.Final
    entrypoint: ["/bin/sh", "/debezium/register-connector.sh"]
    environment:
      CONNECT_URL: http://kafka-connect:8083
      CONFIG_FILE: /debezium/crm-connector.json
    volumes:
      - ./debezium:/debezium:ro
    depends_on:
      - kafka-connect
    restart: "no"

  # Таблицы KafkaEngine, MaterializedView и витрина CDC в ClickHouse
  clickhouse-cdc-init:
    profiles: ["cdc"]
    image: clickhouse/clickhouse-server:24.8
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        ch() { clickhouse-client --host clickhouse --user "$$CH_USER" --password "$$CH_PASSWORD" "$$@"; }
        for f in /cdc/01_*.sql /cdc/02_*.sql; do
          echo "apply $$f"
          ch --multiquery < "$$f"
        done
        # Backfill витрины имеет смысл только после первичного снимка CRM от Debezium
        for i in $$(seq 1 60); do
          [ "$$(ch -q 'SELECT count() FROM reports.crm_prostheses_cdc')" -gt 0 ] && break
          echo "waiting for CRM snapshot from Debezium..."; sleep 5
        done
        echo "apply /cdc/03_backfill.sql"
        ch --multiquery < /cdc/03_backfill.sql
        ch -q "SELECT 'report_daily_cdc rows', count() FROM reports.report_daily_cdc"
    environment:
      CH_USER: ${CLICKHOUSE_ADMIN_USER}
      CH_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
    volumes:
      - ./clickhouse/cdc:/cdc:ro
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: "no"

volumes:
  keycloak-db-data:
  ldap-data:
  ldap-config:
  crm-db-data:
  telemetry-db-data:
  clickhouse-data:
  airflow-db-data:
  airflow-logs:
  minio-data:
  cdn-cache:
  kafka-data:
